<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Calendário do mês</title>
<style>
  :root {
    --fundo: #f6f1e7;
    --cartao: #fffdf8;
    --texto: #1f1d18;
    --suave: #6d675c;
    --linha: #e4dccc;
    --verde: #2f5d3a;
    --vermelho: #c0392b;
    --raio: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--fundo);
    color: var(--texto);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: 200px;
  }
  .topo { padding: 22px 16px 10px; max-width: 720px; margin: 0 auto; }
  .topo small { color: var(--suave); letter-spacing: .04em; text-transform: uppercase; font-size: 12px; }
  .topo h1 { margin: 4px 0 0; font-size: 26px; line-height: 1.15; }
  .guia {
    max-width: 720px; margin: 12px auto 16px; padding: 14px 16px;
    background: var(--cartao); border: 1px solid var(--linha); border-radius: var(--raio);
    font-size: 15px;
  }
  .guia p { margin: 0 0 8px; }
  .guia p:last-child { margin: 0; }
  .guia b { color: var(--verde); }
  @media (max-width: 752px) { .guia { margin-left: 16px; margin-right: 16px; } }

  .grade {
    max-width: 720px; margin: 0 auto; padding: 0 16px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
  }
  .bloco { position: relative; aspect-ratio: 4 / 5; overflow: hidden; border-radius: 4px; background: var(--linha); cursor: pointer; border: 0; padding: 0; }
  .bloco img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bloco .dia {
    position: absolute; left: 6px; top: 6px;
    background: rgba(255,255,255,.92); color: var(--texto);
    font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
  }
  .bloco .varias {
    position: absolute; right: 6px; top: 6px; width: 20px; height: 20px;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.5));
  }

  /* visor: um post por tela, passa pra cima */
  .visor {
    position: fixed; inset: 0; background: var(--fundo); z-index: 10;
    display: none; flex-direction: column;
  }
  .visor.aberto { display: flex; }
  .visor-barra {
    display: flex; align-items: center; justify-content: space-between;
    padding: max(10px, env(safe-area-inset-top)) 16px 10px;
    border-bottom: 1px solid var(--linha); background: var(--fundo);
  }
  .visor-barra button {
    background: none; border: 0; font: inherit; font-weight: 600; color: var(--verde);
    padding: 6px 0; cursor: pointer;
  }
  .visor-barra span { color: var(--suave); font-size: 14px; }
  body.gravando #voltar { visibility: hidden; }
  .lista { flex: 1; overflow-y: auto; scroll-snap-type: y mandatory; }
  .post {
    /* always: um deslize passa um post só, mesmo com o dedo rápido (pedido do Mateus, 18/11) */
    scroll-snap-align: start; scroll-snap-stop: always; min-height: 100%;
    padding: 14px 16px 150px; max-width: 520px; margin: 0 auto;
  }
  .post h2 { margin: 0 0 10px; font-size: 18px; }
  .post h2 span { color: var(--suave); font-weight: 400; }
  .fotos {
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
    border-radius: 8px; background: var(--linha);
  }
  .fotos img { flex: 0 0 100%; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; scroll-snap-align: center; }
  .pontos { display: flex; justify-content: center; gap: 5px; margin-top: 8px; }
  .pontos i { width: 6px; height: 6px; border-radius: 50%; background: var(--linha); }
  .pontos i.ativo { background: var(--verde); }
  .legenda { margin-top: 12px; font-size: 15px; white-space: pre-line; }
  .legenda.curta { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .mais { background: none; border: 0; color: var(--suave); font: inherit; font-size: 14px; padding: 4px 0; cursor: pointer; }

  /* gravação, sempre embaixo */
  .gravador {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 12px 16px max(14px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--fundo) 70%, rgba(246,241,231,0));
  }
  .gravador .dentro { max-width: 520px; margin: 0 auto; }
  .lembrete {
    display: none; text-align: center; font-size: 14px; color: var(--texto);
    background: var(--cartao); border: 1px solid var(--linha); border-radius: 10px;
    padding: 8px 10px; margin-bottom: 8px;
  }
  .gravando .lembrete { display: block; }
  .botao {
    width: 100%; border: 0; border-radius: 999px; padding: 16px;
    font: inherit; font-size: 17px; font-weight: 700; color: #fff; background: var(--verde);
    display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
    text-decoration: none;
  }
  .botao:disabled { opacity: .6; }
  .gravando .botao { background: var(--vermelho); }
  .bola { width: 12px; height: 12px; border-radius: 50%; background: #fff; }
  .gravando .bola { animation: pisca 1s infinite; }
  @keyframes pisca { 50% { opacity: .25; } }
  .erro { display: none; margin-top: 8px; font-size: 14px; color: var(--vermelho); text-align: center; }
  #aprovar { margin-top: 8px; background: var(--cartao); color: var(--verde); border: 1px solid var(--verde); font-size: 16px; padding: 13px; }
  .gravando #aprovar { display: none !important; }

  /* fim */
  .fim { display: none; max-width: 520px; margin: 0 auto; padding: 40px 16px; }
  .fim.aberto { display: block; }
  .fim h1 { font-size: 26px; margin: 0 0 6px; }
  .fim p { color: var(--suave); margin: 0 0 18px; }
  .bastidor { background: var(--cartao); border: 1px solid var(--linha); border-radius: var(--raio); padding: 14px 16px; }
  .bastidor h3 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); }
  .bastidor audio { width: 100%; margin-bottom: 12px; }
  .bastidor ol { margin: 0; padding-left: 20px; font-size: 15px; }
  .bastidor li { margin-bottom: 4px; }
  .bastidor .tempo { font-variant-numeric: tabular-nums; color: var(--suave); }
  /* etapas: Entendi assim / Ajustes prontos / pergunta / aprovado */
  .etapa {
    max-width: 720px; margin: 12px auto 16px; padding: 16px;
    background: var(--cartao); border: 2px solid var(--verde); border-radius: var(--raio);
  }
  @media (max-width: 752px) { .etapa { margin-left: 16px; margin-right: 16px; } }
  .etapa h2 { margin: 0 0 4px; font-size: 20px; }
  .etapa > p { margin: 0 0 12px; color: var(--suave); font-size: 15px; }
  .ajuste { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--linha); cursor: pointer; }
  .ajuste img { width: 64px; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 4px; flex: none; }
  .ajuste b { display: block; font-size: 14px; }
  .ajuste span { font-size: 15px; }
  .ajuste small { display: block; color: var(--verde); font-size: 13px; margin-top: 2px; }
  .vago { border-top: 1px solid var(--linha); padding-bottom: 12px; }
  .vago .ajuste { border-top: 0; }
  .acoes { display: grid; gap: 8px; margin-top: 12px; }
  .secundario { background: none; color: var(--texto); border: 1px solid var(--linha); font-weight: 600; }
  .etapa .secundario { font-size: 16px; padding: 13px; }
  .bloco .nova { position: absolute; left: 6px; bottom: 6px; background: var(--verde); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
  .post .tag { display: inline-block; background: var(--verde); color: #fff; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; vertical-align: middle; }
  .comoera { background: none; border: 0; color: var(--verde); font: inherit; font-size: 14px; font-weight: 600; padding: 6px 0; cursor: pointer; }
  .denovo { margin-top: 16px; background: none; border: 1px solid var(--linha); border-radius: 999px; padding: 10px 16px; font: inherit; cursor: pointer; }
  .esperando::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: pontinhos 1.4s steps(4) infinite; }
  @keyframes pontinhos { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
</style>
</head>
<body>

<main id="inicio">
  <header class="topo">
    <small id="cliente"></small>
    <h1 id="titulo"></h1>
  </header>
  <section class="etapa" id="etapa"><h2 class="esperando">Carregando</h2></section>
  <section class="guia" id="guia" style="display:none"></section>
  <section class="grade" id="grade"></section>
</main>

<section class="visor" id="visor">
  <div class="visor-barra">
    <button id="voltar">Ver o mês</button>
    <span id="posicao"></span>
  </div>
  <div class="lista" id="lista"></div>
</section>

<section class="fim" id="fim">
  <h1 id="fim-titulo">Enviando...</h1>
  <p id="fim-texto">Só um instante, não feche esta página.</p>
  <button class="botao" id="tentar" style="display:none">Tentar de novo</button>
  <div class="bastidor" id="bastidor" style="display:none">
    <h3>Bastidor (só com ?bastidor no link)</h3>
    <audio id="ouvir" controls></audio>
    <ol id="linha"></ol>
  </div>
  <button class="denovo" id="denovo" style="display:none">Voltar pro mês</button>
</section>

<div class="gravador" id="gravador" style="display:none">
  <div class="dentro">
    <div class="lembrete" id="lembrete"></div>
    <button class="botao" id="botao"><span class="bola"></span><span id="rotulo">Gravar áudio</span></button>
    <button class="botao secundario" id="aprovar"></button>
    <div class="erro" id="erro"></div>
  </div>
</div>

<script>
// Página do mês, fluxo novo (22/11). O HTML só tem os posts; em que etapa o mês está vem do Worker

const DADOS = {"cliente": "Inteligência Emocional Masculina", "mes": "novembro", "clienteId": "teste-livro", "mesId": "2026-11", "caixa": "https://caixa-aprovacao.aprovacao-wdr.workers.dev", "posts": [{"id": "2026-11-03", "dia": "ter", "data": "03/11", "hora": "19h", "tipo": "feed", "imagens": ["https://devmateusalmeida.github.io/social-wdr/aprovacao/72629e4976/img/11-03-1.jpg"], "legenda": "Alguém em casa pergunta se está tudo bem.\nVocê responde antes de pensar: “Está.”\nE a conversa acaba ali.\n\nA conta que não fecha, o problema do trabalho, o cansaço que vem de longe. Fica tudo guardado.\nEm casa, todo mundo dorme tranquilo. Você demora pra pegar no sono.\n\nO Marcos, da história que abre o livro, vive essa mesma noite. Talvez você se reconheça nele.\n\nO Livro 1 está no link da bio.\n\n#inteligenciaemocionalmasculina #saudementalmasculina #saudeemocional #sobrecarga #autoconhecimento"}, {"id": "2026-11-05", "dia": "qui", "data": "05/11", "hora": "19h", "tipo": "feed", "imagens": ["https://devmateusalmeida.github.io/social-wdr/aprovacao/72629e4976/img/11-05-1.jpg"], "legenda": "Ninguém senta com um menino pra explicar as regras.\nMesmo assim, ele aprende: não chora, não reclama, não mostra que dói.\n\nIsso tem nome: Caixa da Masculinidade. É a regra não escrita de nunca ser visto como fraco.\nEla vai junto pro trabalho, pro casamento, pras amizades. E quase ninguém percebe que vive dentro dela.\n\nQuando foi a primeira vez que você ouviu que homem não chora?\n\nO Livro 1 está no link da bio.\n\n#inteligenciaemocionalmasculina #caixadamasculinidade #saudementalmasculina #masculinidade #autoconhecimento"}, {"id": "2026-11-07", "dia": "sáb", "data": "07/11", "hora": "19h", "tipo": "feed", "imagens": ["https://devmateusalmeida.github.io/social-wdr/aprovacao/72629e4976/img/11-07-1.jpg"], "legenda": "Alguém pergunta: “Tudo bem?”\nE o “tudo” sai sozinho, antes de você decidir.\n\nHoje, tente uma coisa só: antes de responder, espere um segundo.\nNem precisa dizer algo diferente. Só esperar.\n\nEsse segundo abre espaço entre a resposta automática e a sua resposta. É o dia 2 do desafio da Micro-Verdade, um dos exercícios do livro.\n\nO Livro 1 está no link da bio.\n\n#inteligenciaemocionalmasculina #microverdade #saudementalmasculina #saudeemocional #autoconhecimento"}, {"id": "2026-11-10", "dia": "ter", "data": "10/11", "hora": "19h", "tipo": "feed", "imagens": ["https://devmateusalmeida.github.io/social-wdr/aprovacao/72629e4976/img/11-10-1.jpg"], "legenda": "O boleto chega, você olha o valor e fecha o aplicativo do banco.\nEm casa, chega sorrindo e pergunta como foi o dia de todo mundo.\n\nVocê guarda o aperto pra eles não se preocuparem.\nSó que a preocupação continua ali, toda com você, e pesa em dobro.\n\nQuando foi a última vez que você contou em casa que o mês estava apertado?\n\nO Livro 1 está no link da bio.\n\n#inteligenciaemocionalmasculina #saudementalmasculina #sobrecarga #financaspessoais #saudeemocional"}, {"id": "2026-11-12", "dia": "qui", "data": "12/11", "hora": "19h", "tipo": "feed", "imagens": ["https://devmateusalmeida.github.io/social-wdr/aprovacao/72629e4976/img/11-12-1.jpg"], "legenda": "Alguém pergunta como você está e a resposta sai antes de pensar: “tudo bem”.\nDe tanto repetir, vira piloto automático.\n\nO silêncio é um padrão aprendido cedo, que vira hábito.\nE o corpo continua avisando, com o peito apertado, a cabeça doendo, o estômago queimando.\n\nQuantas vezes você já disse “tudo bem” hoje sem pensar?\n\nO Livro 1 está no link da bio.\n\n#inteligenciaemocionalmasculina #saudementalmasculina #autoconhecimento #saudeemocional #pilotoautomatico"}, {"id": "2026-11-14", "dia": "sáb", "data": "14/11", "hora": "19h", "tipo": "feed", "imagens": ["https://devmateusalmeida.github.io/social-wdr/aprovacao/72629e4976/img/11-14-1.jpg"], "legenda": "Antes de dormir, pega o celular e abre o bloco de notas.\nRepara no corpo primeiro: peito apertado, cabeça pesada, cansaço.\nDepois escreve uma frase honesta sobre como foi o dia. Só uma.\n\nNinguém vai ler. É o dia 1 do desafio da Micro-Verdade, que está no livro.\n\nO Livro 1 está no link da bio.\n\n#inteligenciaemocionalmasculina #saudementalmasculina #autoconhecimento #saudeemocional #autocuidado"}, {"id": "2026-11-17", "dia": "ter", "data": "17/11", "hora": "19h", "tipo": "feed", "imagens": ["https://devmateusalmeida.github.io/social-wdr/aprovacao/72629e4976/img/11-17-1.jpg"], "legenda": "O carro da frente demora no sinal e você já está buzinando.\nChega em casa e qualquer pergunta parece cobrança.\n\nA paciência não acabou do nada.\nO dia inteiro ficou guardado, e o que não foi dito acaba saindo por outro lado.\n\nO que você engoliu hoje antes de pegar o trânsito?\n\nO Livro 1 está no link da bio.\n\n#inteligenciaemocionalmasculina #saudementalmasculina #estresse #transito #saudeemocional"}, {"id": "2026-11-19", "dia": "qui", "data": "19/11", "hora": "19h", "tipo": "feed", "imagens": ["https://devmateusalmeida.github.io/social-wdr/aprovacao/72629e4976/img/11-19-1.jpg"], "legenda": "Alguém pergunta o que você está sentindo e a resposta sai: “não sei”.\nE muitas vezes é verdade.\n\nO peito aperta, o estômago queima, a cabeça dói.\nO sentimento está ali, só não chegou a virar palavra.\n\nDar nome ao que sente se aprende, como qualquer outra coisa.\n\nO Livro 1 está no link da bio.\n\n#inteligenciaemocionalmasculina #saudementalmasculina #emocoes #autoconhecimento #saudeemocional"}, {"id": "2026-11-21", "dia": "sáb", "data": "21/11", "hora": "19h", "tipo": "feed", "imagens": ["https://devmateusalmeida.github.io/social-wdr/aprovacao/72629e4976/img/11-21-1.jpg"], "legenda": "Te perguntam como você está e o “tudo bem” já está na ponta da língua.\nHoje dá pra tentar outra coisa.\n\n“O dia está corrido.”\n“Estou um pouco cansado hoje.”\n\nÉ pequeno, e é verdade. É o dia 3 do desafio da Micro-Verdade do livro.\n\nO Livro 1 está no link da bio.\n\n#inteligenciaemocionalmasculina #saudementalmasculina #microverdade #autocuidado #saudeemocional"}, {"id": "2026-11-24", "dia": "ter", "data": "24/11", "hora": "19h", "tipo": "feed", "imagens": ["https://devmateusalmeida.github.io/social-wdr/aprovacao/72629e4976/img/11-24-1.jpg"], "legenda": "Cansaço que a gente guarda não sai no travesseiro.\n\nVocê deita, apaga a luz, e a cabeça continua na conta que não fechou e na conversa que ficou pra depois.\n\nDe manhã levanta, toma o café e diz que dormiu bem. Ninguém em casa percebe.\n\nQuando foi a última vez que você contou pra alguém que não está dormindo direito?\n\nA história do Marcos, que também diz “está tudo bem” em casa, está no Livro 1, no link da bio.\n\n#inteligenciaemocionalmasculina #saudementalmasculina #cansacomental #sono #emocoesmasculinas"}, {"id": "2026-11-26", "dia": "qui", "data": "26/11", "hora": "19h", "tipo": "feed", "imagens": ["https://devmateusalmeida.github.io/social-wdr/aprovacao/72629e4976/img/11-26-1.jpg"], "legenda": "Um erro comum é achar que guardar tudo é jeito de ser, coisa de quem já nasceu assim.\n\nMuitas vezes esse silêncio foi aprendido cedo, junto com a regra de nunca parecer fraco.\n\nNaquela época, calar protegia. Com os anos virou hábito, e hoje o “tudo bem” sai antes de você pensar.\n\nSe foi aprendido, dá pra aprender outro jeito, um passo de cada vez.\n\nO Livro 1 mostra de onde vem esse padrão. Está no link da bio.\n\n#inteligenciaemocionalmasculina #saudementalmasculina #saudeemocional #emocoes #homens"}, {"id": "2026-11-28", "dia": "sáb", "data": "28/11", "hora": "19h", "tipo": "feed", "imagens": ["https://devmateusalmeida.github.io/social-wdr/aprovacao/72629e4976/img/11-28-1.jpg"], "legenda": "Sábado chega e você passa o dia resolvendo o que sobrou da semana: o mercado, o conserto, a conta pra pagar.\n\nNo livro tem três perguntas pra puxar a cortina. Uma delas quase ninguém faz pra si mesmo: qual é a sua maior necessidade hoje?\n\nPode ser dormir. Pode ser conversar com alguém. Pode ser ficar uma hora quieto sem ninguém pedir nada.\n\nEscreve a resposta no celular, só pra você. Uma linha já serve.\n\nO Livro 1 está no link da bio, com as outras duas perguntas.\n\n#inteligenciaemocionalmasculina #saudeemocional #saudementalmasculina #autoconhecimento #homens"}]};
const $ = (id) => document.getElementById(id);

    b.className = "bloco";
    b.innerHTML = '<img alt="" src="' + esc(p.imagens[0]) + '">' +
      (p.imagens.length > 1 ? iconeVarias : "") +
      '<span class="dia">' + esc(p.dia + " " + p.data) + "</span>" +
      (p.antes ? '<span class="nova">versão nova</span>' : "");
    b.onclick = () => abrirVisor(i);
    $("grade").appendChild(b);

    const s = document.createElement("article");
    s.className = "post";
    s.dataset.i = i;
    const fotos = p.imagens.map((u) => '<img loading="lazy" alt="" src="' + esc(u) + '">').join("");
    const pontos = p.imagens.length > 1
      ? '<div class="pontos">' + p.imagens.map((_, k) => '<i class="' + (k ? "" : "ativo") + '"></i>').join("") + "</div>" : "";
    s.innerHTML = "<h2>" + esc(p.dia + " " + p.data) + " <span>" + esc(p.hora) + "</span>" +
      (p.antes ? ' <i class="tag">versão nova</i>' : "") + "</h2>" +
      '<div class="fotos">' + fotos + "</div>" + pontos +
      (p.antes ? '<button class="comoera">Ver como era</button>' : "") +
      '<div class="legenda curta"></div><button class="mais">ver legenda inteira</button>';
    if (p.antes) {
      const botaoEra = s.querySelector(".comoera");
      let vendoAntes = false;
      botaoEra.onclick = () => {
        vendoAntes = !vendoAntes;
        const lista = vendoAntes ? p.antes : p.imagens;
        s.querySelectorAll(".fotos img").forEach((img, k) => { img.src = lista[k] || lista[0]; });
        botaoEra.textContent = vendoAntes ? "Ver a versão nova" : "Ver como era";
      };
    }
    s.querySelector(".legenda").textContent = p.legenda;
    const mais = s.querySelector(".mais");
    mais.onclick = () => {
      const l = s.querySelector(".legenda");
      l.classList.toggle("curta");
      mais.textContent = l.classList.contains("curta") ? "ver legenda inteira" : "mostrar menos";
    };
    const trilho = s.querySelector(".fotos");
    trilho.addEventListener("scroll", () => {
      const k = Math.round(trilho.scrollLeft / trilho.clientWidth);
      if (k !== (+trilho.dataset.k || 0)) {
        trilho.dataset.k = k;
        s.querySelectorAll(".pontos i").forEach((d, j) => d.classList.toggle("ativo", j === k));
        atualizar();
      }
    }, { passive: true });
    $("lista").appendChild(s);
    visivel.observe(s);
  });
}

let postAtual = null;
function abrirVisor(i) {
  $("visor").classList.add("aberto");
  const alvo = $("lista").children[i];
  $("lista").scrollTop = alvo.offsetTop;
  postAtual = i;
  atualizar();
}
$("voltar").onclick = () => { $("visor").classList.remove("aberto"); atualizar(); };

// onde a pessoa está agora: "grade" ou post (e slide do carrossel)
function ondeEsta() {
  if (!$("visor").classList.contains("aberto") || postAtual === null) return "a grade do mês";
  const p = posts[postAtual];
  let t = "post de " + nome(p);
  if (p.imagens.length > 1) {
    const k = +($("lista").children[postAtual].querySelector(".fotos").dataset.k || 0);
    t += " (slide " + (k + 1) + " de " + p.imagens.length + ")";
  }
  return t;
}

function atualizar() {
  if ($("visor").classList.contains("aberto") && postAtual !== null) {
    $("posicao").textContent = (postAtual + 1) + " de " + posts.length;
  }
  if (gravacao) marcar();
}

// ---------- gravação ----------
let gravacao = null, pedacos = [], inicio = 0, marcas = [], relogio = null;

function marcar() {
  const onde = ondeEsta();
  const ultima = marcas[marcas.length - 1];
  if (ultima && ultima.nome === onde) return;
  const aberto = $("visor").classList.contains("aberto") && postAtual !== null;
  const p = aberto ? posts[postAtual] : null;
  const slide = p && p.imagens.length > 1
    ? +($("lista").children[postAtual].querySelector(".fotos").dataset.k || 0) + 1 : null;
  marcas.push({ t: Math.round((performance.now() - inicio) / 100) / 10, nome: onde, post: p ? p.id : null, slide });
}

function formato() {
  const op = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg"];
  return op.find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
}

const mmss = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

async function comecar() {
  $("erro").style.display = "none";
  let fluxo;
  try {
    fluxo = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    $("erro").textContent = "Não deu pra usar o microfone (" + (e.name || e) + "). Abra este link no navegador do celular e permita o microfone.";
    $("erro").style.display = "block";
    return;
  }
  const tipo = formato();
  gravacao = new MediaRecorder(fluxo, tipo ? { mimeType: tipo } : undefined);
  pedacos = []; marcas = [];
  gravacao.ondataavailable = (e) => { if (e.data.size) pedacos.push(e.data); };
  gravacao.onstop = () => terminar(fluxo);
  // grava sempre com um post aberto: da grade, abre o primeiro
  inicio = performance.now();
  if (!$("visor").classList.contains("aberto")) abrirVisor(0);
  gravacao.start(1000);
  marcar();
  $("gravador").classList.add("gravando");
  document.body.classList.add("gravando");
  relogio = setInterval(() => {
    $("rotulo").textContent = "Gravando " + mmss((performance.now() - inicio) / 1000) + ", toque pra enviar";
  }, 250);
  $("rotulo").textContent = "Gravando 0:00, toque pra enviar";
}

let duracao = 0, ultimoAudio = null;

function parar() {
  clearInterval(relogio);
  duracao = (performance.now() - inicio) / 1000;
  marcas.push({ t: Math.round(duracao * 10) / 10, nome: "fim", post: null, slide: null });
  gravacao.stop();
}

function terminar(fluxo) {
  fluxo.getTracks().forEach((t) => t.stop());
  ultimoAudio = new Blob(pedacos, { type: gravacao.mimeType || "audio/webm" });
  gravacao = null;
  $("gravador").classList.remove("gravando");
  document.body.classList.remove("gravando");
  $("rotulo").textContent = "Gravar áudio";
  if (new URLSearchParams(location.search).has("bastidor")) mostrarBastidor();
  $("visor").classList.remove("aberto");
  $("inicio").style.display = "none";
  $("gravador").style.display = "none";
  $("fim").classList.add("aberto");
  window.scrollTo(0, 0);
  enviar();
}

function mostrarBastidor() {
  $("bastidor").style.display = "block";
  $("ouvir").src = URL.createObjectURL(ultimoAudio);
  const ol = $("linha");
  ol.innerHTML = "";
  for (let k = 0; k < marcas.length - 1; k++) {
    const a = marcas[k], b = marcas[k + 1];
    if (b.t - a.t < 0.8) continue; // passou rápido, não conta
    const li = document.createElement("li");
    li.innerHTML = '<span class="tempo">' + mmss(a.t) + " a " + mmss(b.t) + "</span> ";
    li.appendChild(document.createTextNode(a.nome));
    ol.appendChild(li);
  }
}

function voltarDoFim() {
  $("fim").classList.remove("aberto");
  $("bastidor").style.display = "none";
  $("inicio").style.display = "";
}

function formBase(etapa) {
  const form = new FormData();
  form.append("cliente", DADOS.clienteId);
  form.append("mes", DADOS.mesId);
  form.append("papel", PAPEL);
  form.append("chave", CHAVE);
  form.append("rodada", String(estado ? estado.rodada : 0));
  if (etapa) form.append("etapa", etapa);
  return form;
}

async function enviar() {
  $("fim-titulo").textContent = "Enviando...";
  $("fim-texto").textContent = "Só um instante, não feche esta página.";
  $("tentar").style.display = "none";
  $("denovo").style.display = "none";
  const tipo = ultimoAudio.type || "audio/webm";
  const ext = tipo.includes("mp4") ? "m4a" : tipo.includes("ogg") ? "ogg" : "webm";
  const form = formBase();
  form.append("duracao", String(Math.round(duracao * 10) / 10));
  form.append("marcas", JSON.stringify(marcas));
  form.append("audio", ultimoAudio, "audio." + ext);
  let r, j = {};
  try {
    r = await fetch(DADOS.caixa + "/audio", { method: "POST", body: form });
    try { j = await r.json(); } catch (e) { j = {}; }
  } catch (e) {
    r = { ok: false, status: 0, erro: e.message || String(e) };
  }
  if (r.ok) {
    voltarDoFim();
    modo = "";
    aplicarEstado(j.estado || { ...estado, etapa: "ouvindo" }, true);
    window.scrollTo(0, 0);
    return;
  }
  if (r.status === 409 && j.estado) {
    $("fim-titulo").textContent = "A página mudou";
    $("fim-texto").textContent = "Enquanto você gravava, este mês mudou de etapa e o áudio não foi. Volte pro mês pra ver como está agora.";
    $("denovo").style.display = "inline-block";
    $("denovo").onclick = () => { voltarDoFim(); modo = ""; aplicarEstado(j.estado, true); };
    return;
  }
  $("fim-titulo").textContent = "Não foi";
  $("fim-texto").textContent = "O áudio não chegou (" + (r.erro || "código " + r.status) + "). Confira a internet e tente de novo, ele continua guardado aqui.";
  $("tentar").style.display = "flex";
}

// ---------- etapas, vindas do Worker ----------
let estado = null, vista = "", assinaturaImagens = "", modo = "", relogioBusca = null;

function caixaEtapa(html) {
  const c = $("etapa");
  c.style.display = "block";
  c.innerHTML = html;
  return c;
}
function telas({ guia = false, gravar = false, aprovar = false } = {}) {
  $("guia").style.display = guia ? "" : "none";
  $("gravador").style.display = gravar ? "" : "none";
  $("aprovar").style.display = aprovar ? "" : "none";
  $("lembrete").textContent = LEMBRETE;
}
function quando(segundos) {
  const d = new Date(segundos ? segundos * 1000 : Date.now());
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + " às " +
    d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }).replace(":", "h");
}
function acoes(caixa, botoes) {
  const div = document.createElement("div");
  div.className = "acoes";
  botoes.forEach(([texto, classe, clique]) => {
    const b = document.createElement("button");
    b.className = "botao" + (classe ? " " + classe : "");
    b.textContent = texto;
    b.onclick = () => clique(b);
    div.appendChild(b);
  });
  const erro = document.createElement("div");
  erro.className = "erro";
  div.appendChild(erro);
  caixa.appendChild(div);
  return div;
}
function listaAjustes(caixa, ajustes, verNovo) {
  (ajustes || []).forEach((a) => {
    const i = indice(a.post);
    if (i < 0) return;
    const p = posts[i];
    const linha = document.createElement("div");
    linha.className = "ajuste";
    linha.innerHTML = '<img alt="" src="' + esc(p.imagens[0]) + '"><div><b>' + esc(nome(p)) + "</b><span></span>" +
      (verNovo ? "<small>toque pra ver</small>" : "") + "</div>";
    linha.querySelector("span").textContent = a.resumo;
    linha.onclick = () => abrirVisor(i);
    caixa.appendChild(linha);
  });
}

// "gravar de novo", "esqueci de falar algo", "quero mudar outro": volta o botão Gravar sem mudar a etapa
function telaGravar(texto) {
  modo = "gravar";
  caixaEtapa("<h2>Sem problema</h2><p>" + texto + "</p>");
  telas({ guia: true, gravar: true });
}
function gravarSobre(i) {
  modo = "sobre";
  caixaEtapa("<h2>Gravar sobre esse post</h2><p>Aperte Gravar, fale o que quer mudar nele e toque pra enviar.</p>");
  telas({ gravar: true });
  $("lembrete").textContent = "Fale o que quer mudar neste post e toque pra enviar.";
  abrirVisor(i);
}
function telaAprovar() {
  modo = "aprovar";
  const c = caixaEtapa(W
    ? "<h2>Liberar pro cliente?</h2><p>Os " + N + " posts vão pro cliente do jeito que estão. Depois aparece o botão pra mandar o link no WhatsApp.</p>"
    : "<h2>Aprovar " + MES + "?</h2><p>Os " + N + " posts saem nos dias marcados, do jeito que estão.</p>");
  telas();
  acoes(c, [[W ? "Sim, liberar" : "Sim, aprovar", "", (b) => tocar("liberar", {}, b)],
            ["Voltar", "secundario", () => { modo = ""; mostrar(true); }]]);
  window.scrollTo(0, 0);
}
$("aprovar").onclick = telaAprovar;

async function tocar(etapa, extra, botao) {
  const texto = botao.textContent;
  botao.disabled = true;
  botao.textContent = "Enviando...";
  const erro = botao.parentElement.querySelector(".erro");
  const form = formBase(etapa);
  Object.entries(extra || {}).forEach(([k, v]) => form.append(k, v));
  try {
    const r = await fetch(DADOS.caixa + "/confirmar", { method: "POST", body: form });
    let j = {};
    try { j = await r.json(); } catch (e) {}
    if (!r.ok && !(r.status === 409 && j.estado)) throw new Error("código " + r.status);
    modo = "";
    aplicarEstado(j.estado, true);
  } catch (e) {
    botao.disabled = false;
    botao.textContent = texto;
    if (erro) { erro.textContent = "Não foi (" + (e.message || e) + "). Confira a internet e toque de novo."; erro.style.display = "block"; }
  }
}

const COM_O_CLIENTE = {
  gravar: "Liberado. Toque no botão pra mandar o link pro cliente no WhatsApp (dá pra mudar o texto antes de enviar). Ele ainda não gravou nem aprovou.",
  ouvindo: "O cliente mandou um áudio. Estamos ouvindo.",
  pergunta: "O cliente pediu uma mudança sem dizer o quê. A página perguntou a ele o que mudar.",
  processando: "O cliente respondeu a pergunta. Já aparece o próximo passo.",
  lista: "O cliente está conferindo a lista do que entendemos.",
  ajustando: "O cliente confirmou os ajustes. O Mateus está refazendo.",
  versoes: "Os ajustes prontos estão com o cliente pra conferir.",
};

function mostrar(forcar) {
  const e = estado;
  const chave = [e.fase, e.etapa, e.rodada, e.outros, JSON.stringify(e.vagos || []), JSON.stringify(e.ajustes || [])].join("|");
  if (chave !== vista) modo = "";
  else if (!forcar) return;
  vista = chave;
  if (gravacao || modo) return;   // nunca mexe na tela no meio da gravação nem do que a pessoa abriu
  $("grade").style.display = "";

  if (e.fase === "sem") {
    caixaEtapa("<h2>Este link não está valendo</h2><p>Peça o link de novo pra quem te mandou.</p>");
    telas();
    return;
  }
  if (e.fase === "preparando") {
    caixaEtapa("<h2>Quase pronto</h2><p>Os posts de " + MES + " ainda estão sendo preparados. Assim que ficarem prontos, te mandamos o link.</p>");
    $("grade").style.display = "none";
    telas();
    return;
  }
  if (W && e.fase !== "william") {
    const c = caixaEtapa(e.fase === "fechado"
      ? "<h2>" + MES_TITULO + " aprovado ✓</h2><p>Aprovado pelo cliente em " + quando(e.fechado_em) + ".</p>"
      : "<h2>Com o cliente</h2><p>" + (COM_O_CLIENTE[e.etapa] || "") + "</p>");
    if (["lista", "ajustando", "versoes"].includes(e.etapa)) listaAjustes(c, e.ajustes, e.etapa === "versoes");
    if (e.whatsapp && e.fase === "cliente") {
      const a = document.createElement("a");
      a.className = "botao";
      a.style.marginTop = "12px";
      a.href = e.whatsapp;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = e.etapa === "gravar" ? "Mandar o link no WhatsApp" : "Mandar o link de novo no WhatsApp";
      c.appendChild(a);
    }
    telas();
    return;
  }

  const c = $("etapa");
  switch (e.etapa) {
    case "gravar":
      c.style.display = "none";
      telas({ guia: true, gravar: true, aprovar: true });
      return;
    case "ouvindo":
      caixaEtapa('<h2 class="esperando">Recebido! Ouvindo seu áudio</h2><p>Em alguns minutos aparece aqui o que entendemos, pra você conferir. ' +
        "Pode deixar esta página aberta ou fechar e abrir o link de novo depois.</p>");
      telas();
      return;
    case "processando":
      caixaEtapa('<h2 class="esperando">Combinado! Só um instante</h2><p>Já aparece aqui o próximo passo.</p>');
      telas();
      return;
    case "pergunta": return telaPergunta();
    case "lista": {
      const cx = caixaEtapa("<h2>Entendi assim</h2><p>Confere se é isso que você quer mudar.</p>");
      listaAjustes(cx, e.ajustes, false);
      const nota = document.createElement("p");
      nota.style.cssText = "margin:12px 0 0;font-size:15px;color:var(--suave)";
      nota.textContent = e.frase ? "Os outros posts ficam como estão."
        : "Você não disse se os outros posts podem ir. Se estiver tudo certo com eles, é só tocar em Tá certo.";
      cx.appendChild(nota);
      acoes(cx, [["Tá certo", "", (b) => tocar("lista", {}, b)],
                 ["Não é isso, gravar de novo", "secundario", () => telaGravar("Aperte Gravar lá embaixo, vá passando os posts e fale o que quer mudar.")]]);
      telas();
      return;
    }
    case "ajustando": {
      const cx = caixaEtapa("<h2>Combinado!</h2><p>" + (W
        ? "Os ajustes estão sendo feitos. O aviso chega no seu Telegram quando ficarem prontos."
        : "Confirmado em " + quando(e.atualizado) + ". Te avisamos pelo WhatsApp quando os ajustes ficarem prontos. Pode fechar esta página.") + "</p>");
      listaAjustes(cx, e.ajustes, false);
      acoes(cx, [["Esqueci de falar algo", "secundario", () => telaGravar("Aperte Gravar lá embaixo, vá passando os posts e fale o que faltou.")]]);
      telas();
      return;
    }
    case "versoes": {
      const cx = caixaEtapa("<h2>Ajustes prontos</h2><p>Toque em cada um pra ver grande. Dá pra ver como era antes.</p>");
      listaAjustes(cx, e.ajustes, true);
      acoes(cx, [[W ? "Ficou certo, liberar pro cliente" : "Ficou tudo certo", "", (b) => tocar("final", {}, b)],
                 ["Ainda quero mudar", "secundario", () => telaGravar("Aperte Gravar lá embaixo, vá passando os posts e fale o que quer mudar.")]]);
      telas();
      return;
    }
    case "fechado": {
      const cx = caixaEtapa("<h2>" + MES_TITULO + " aprovado ✓</h2><p>Aprovado por você em " + quando(e.fechado_em) + ".</p>" +
        "<p>Os " + N + " posts saem nos dias marcados. Pode fechar esta página.</p>");
      acoes(cx, [["Quero mudar mais alguma coisa", "secundario", () => telaGravar("Aperte Gravar lá embaixo, vá passando os posts e fale o que quer mudar.")]]);
      telas();
      return;
    }
  }
}

// fala vaga: a pergunta que ia pro grupo, agora aqui (19/11 → 22/11)
function telaPergunta() {
  const e = estado;
  const abertos = (e.vagos || []).filter((v) => !v.resposta);
  if (abertos.length) {
    const cx = caixaEtapa("<h2>Uma dúvida</h2><p>" + (abertos.length > 1 ? "Em " + abertos.length + " posts" : "Num post") +
      " não deu pra saber o que mudar. Toque em <b>Gravar sobre esse post</b> e fale só dele, ou em <b>Faz outro do zero</b> se preferir que a gente traga outra ideia.</p>");
    abertos.forEach((v) => {
      const i = indice(v.post);
      if (i < 0) return;
      const d = document.createElement("div");
      d.className = "vago";
      d.innerHTML = '<div class="ajuste"><img alt="" src="' + esc(posts[i].imagens[0]) + '"><div><b>' + esc(nome(posts[i])) + "</b><span></span></div></div>";
      d.querySelector("span").textContent = (v.fala ? 'Você disse "' + v.fala + '". ' : "") + "O que quer mudar: texto, foto, cor ou o post inteiro?";
      d.querySelector(".ajuste").onclick = () => abrirVisor(i);
      acoes(d, [["Gravar sobre esse post", "", () => gravarSobre(i)],
                ["Faz outro do zero", "secundario", (b) => tocar("zero", { post: v.post }, b)]]);
      cx.appendChild(d);
    });
  } else if (!e.frase && !e.outros) {
    const zeros = (e.vagos || []).filter((v) => v.resposta === "zero").map((v) => {
      const i = indice(v.post);
      return i < 0 ? v.post : nome(posts[i]);
    });
    const cx = caixaEtapa("<h2>E os outros posts, estão certos?</h2><p>" +
      (zeros.length ? "Combinado: " + esc(zeros.join(" e ")) + " vai ser refeito do zero, com outra ideia. " : "") + "Falta só saber dos outros.</p>");
    acoes(cx, [["Sim, estão certos", "", (b) => tocar("outros", {}, b)],
               ["Quero mudar outro", "secundario", () => telaGravar("Aperte Gravar lá embaixo, vá passando os posts e fale o que quer mudar.")]]);
  } else {
    caixaEtapa('<h2 class="esperando">Combinado! Só um instante</h2><p>Já aparece aqui o próximo passo.</p>');
  }
  telas();
}

function aplicarEstado(e, forcar) {
  if (!e) return;
  estado = e;
  const assinatura = JSON.stringify([e.trocas || {}, e.antes || {}]);
  if (assinatura !== assinaturaImagens) {
    assinaturaImagens = assinatura;
    posts = DADOS.posts.map((p) => ({ ...p, imagens: (e.trocas || {})[p.id] || p.imagens, antes: (e.antes || {})[p.id] || null }));
    const aberto = $("visor").classList.contains("aberto") ? postAtual : null;
    montarPosts();
    if (aberto !== null && !gravacao) abrirVisor(aberto);
  }
  mostrar(forcar);
  agendar();
}

function agendar() {
  clearTimeout(relogioBusca);
  if (!estado || estado.fase === "sem") return;
  const rapido = ["ouvindo", "processando"].includes(estado.etapa);
  relogioBusca = setTimeout(buscar, rapido ? 4000 : 20000);
}

async function buscar() {
  if (document.hidden || gravacao) { agendar(); return; }
  const q = new URLSearchParams({ cliente: DADOS.clienteId, mes: DADOS.mesId, papel: PAPEL, chave: CHAVE });
  try {
    const r = await fetch(DADOS.caixa + "/estado?" + q, { cache: "no-store" });
    if (r.status === 401) { aplicarEstado({ fase: "sem" }); return; }
    const j = await r.json();
    aplicarEstado(r.ok || r.status === 404 ? j : null);
    if (!r.ok && r.status !== 404) throw new Error("código " + r.status);
  } catch (e) {
    if (!estado) {
      const c = caixaEtapa("<h2>Não carregou</h2><p>Não consegui ver em que pé está o mês (" + esc(e.message || e) + "). Confira a internet.</p>");
      acoes(c, [["Tentar de novo", "", () => { caixaEtapa('<h2 class="esperando">Carregando</h2>'); buscar(); }]]);
    }
    clearTimeout(relogioBusca);
    relogioBusca = setTimeout(buscar, 10000);
  }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) buscar(); });

montarPosts();
if (!CHAVE) {
  caixaEtapa("<h2>Link incompleto</h2><p>Falta um pedaço do link. Peça o link de novo pra quem te mandou.</p>");
} else {
  buscar();
}

$("botao").onclick = () => (gravacao ? parar() : comecar());
$("tentar").onclick = enviar;
$("denovo").onclick = () => { voltarDoFim(); mostrar(true); };
</script>
