# Acorda o publicador a cada 15 minutos, em minutos quebrados porque os
# redondos (:00, :15...) são os mais congestionados no GitHub (às vezes atrasa alguns
# minutos; o horário da fila vale como "a partir de"). Também dá pra rodar
# na mão em Actions > Publicar > Run workflow. Pra pausar tudo:
# Actions > Publicar > ... > Disable workflow.
name: Publicar

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      renovar_agora:
        description: "Renovar os tokens agora, mesmo antes dos 30 dias"
        type: boolean
        default: false

permissions:
  contents: write

# nunca duas voltas ao mesmo tempo
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Publicar o que já passou do horário
        # um token por cliente; cliente novo = segredo novo + uma linha aqui
        env:
          IG_TOKEN_TESTE_LIVRO: ${{ secrets.IG_TOKEN_TESTE_LIVRO }}
          # chave que deixa o robô gravar o token renovado (só segredos deste repositório)
          GH_SEGREDOS: ${{ secrets.GH_SEGREDOS }}
          # bot do Telegram que leva os posts pra aprovação (um só pra WDR)
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          RENOVAR_AGORA: ${{ inputs.renovar_agora }}
        run: python3 publicar.py
